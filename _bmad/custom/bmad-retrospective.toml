# Project customization: aggregate review and current owner acceptance rules.
[workflow]
persistent_facts = [
  "file:{project-root}/_bmad/custom/project-engineering-contract.md",
  "file:{project-root}/_bmad/custom/element-free-engine-design.md",
  "file:{project-root}/_bmad/custom/element-free-engine-review.md",
  "file:{project-root}/_bmad/custom/bmad-loop-protocol.md",
]
activation_steps_prepend = [
"Resolve this customization using the installed schema before approval. Apply current owner policy and the loop protocol to the effective configuration, native record, role-specific inputs and genuinely no-history independent reviewer dispatch. Missing evidence or instruction means Incomplete, represented by rejected with the reason in this workflow; no defaults-only acceptance.",
]
activation_steps_append = [
"Use existing story/review/verification receipts to identify where defects first surfaced, repeated repair cycles, full-round invalidations and duplicate checks; unknown duration stays unknown. For a repeated defect, choose the smallest preventive change at its earliest reliable detection point (type constraint, existing boundary test, explicit contract or clearer handoff). Judge improvement by reduced recurrence and unnecessary verification while preserving gates. Record in native lessons/actions; no new metrics store, percentage targets, finding quotas, LOC limits or default extra reviewers.",
  "Phase 4 acceptance boundary: after confirmed repairs and affected independent re-review, apply bmad-loop-protocol.md's Final diff scope check and required simplification analysis to the final aggregate owned delta against original epic intent/criteria and justified repair closure before an accepted verdict or completion synchronization. Record Final diff scope in the native retrospective; Fail or Incomplete keeps acceptance rejected. Review-only reporting may finish without asserting epic acceptance or authorizing repairs.",
"Phase 1: identify aggregate scope, original criteria, actual story/commit evidence and named deferred gates. Missing criteria or completeness evidence prevents acceptance; native profiled criteria may inform investigation but cannot certify unspecified intent.",
"Phase 2: inspect cross-story boundaries and aggregate architecture. Invoke the existing bmad-review with adversarial, edge-case-hunter, verification-gap and element-free-engine lenses when applicable engineering rules need acceptance; do not treat an exact partial review as complete approval. Use fresh no-history contexts and bounded independent waves. Preserve role-specific contract/evidence inputs. The native behavior-check instruction uses required-now production native simulation/compiled TypeScript evidence; actual Chrome and browser-toolchain qualification stays at catalogue closure, never an earlier gate. Reuse applicable matching evidence and investigate actual gaps; do not rerun all tests solely because this is a retrospective.",
"Phase 4 replaces defer/accept-as-is and accepted-with-open-items for confirmed findings: origin, pre-existing status, low severity or the initial story scope never waives repair. Record the necessary repair closure and owner in existing actions, route repairs through the normal authorized implementation/review loop, and keep verdict rejected until fixes and independent re-review close every confirmed finding. Retrospective completion is not epic acceptance. A review-only invocation may finish its rejected report; it does not itself authorize code mutation or silently accept the debt. Unresolved required evidence is rejected with reason Incomplete. Deferred browser/performance qualification under current owner policy is a named later gate, not a confirmed defect.",
"Phases 4–5: source each proposed lesson to an observed failure and permitted alternative; update the existing rule/customization that owns it instead of duplicating standing rules. Track fix owner, next check and prior-action follow-through in native artifacts. Do not auto-rewrite requirements to match implementation. Generic human-override menus cannot waive the standing repair policy; only a new explicit owner instruction can change it. Record current evidence and pending qualification honestly; no CI wait and no automatic publication.",
]
