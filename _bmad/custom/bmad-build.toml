# Project overrides. Requirements: element-free-engine-design.md; verdicts: element-free-engine-review.md.
# Keep policy text in those guides; prompts below load them explicitly for context-free agents.
[workflow]
activation_steps_append = [
  "Step-04 and step-oneshot Review post-review: after repairs and affected independent re-review, run bmad-loop-protocol.md's Final diff scope check and required simplification analysis on the full owned candidate before step-05, Finalize Spec, done, sprint synchronization or Commit/publication. Record Final diff scope in Review Triage Log; Fail or Incomplete blocks completion. This sequential check is not an additional review layer.",
  '''
Apply the engine gate to both dispatch and oneshot routes:
1. Before step-01 resumes ready/in-progress work, validate the selected spec's affected design and planning verdict.
2. Step-02: include the eight design answers and planned acceptance in normal Code Map/verification fields. If the small-change branch uses only Intent and Implementation Notes, retain the concise affected-design record and planning verdict in Implementation Notes before its early exit; size does not waive the gate.
3. Step-03 uses the customized implementation handoff. A design conflict returns to planning.
4. Step-04 and step-oneshot Review use their configured Element-Free auditor. Confirmed applicable violations are blocking; engine-specific and forward-only findings are high, other findings use source-policy severity; do not defer them because their fix changes a spec or context file. Preserve native route names; a nontrivial oneshot design conflict stops and replans, not done-with-deferred-work.
5. Before Finalize Spec, sprint completion synchronization or Commit, record the acceptance verdict and proof in the existing Review Triage Log. Require independent re-review of relevant fixes. Do not rely on on_complete, which executes too late to guard done/commit.
''',
]

activation_steps_prepend = [
  "Before dispatch run dotnet run --file '{project-root}/tools/anvil/VerifyPolicy.cs' -- --bmad-check --project-root '{project-root}' --route <selected-route>; first substitute the selected native route: BuildReview or BuildOneshot. Apply Effective configuration preflight after structural checks; condition meaning and route behavior require semantic inspection.",
  "Maintainability gate (owner, 5 November 2026; project-engineering-contract.md E9 and bmad-loop-protocol.md Maintainability gate). This is a hard gate for every slice that starts after adoption (9A.46e, in progress at adoption, finishes under its starting rules; coupling findings do not block 9A.46g, in progress when coupling was added on 6 November 2026): no route, resume, size, small-change or oneshot shortcut skips it. Run dotnet run --file '{project-root}/tools/anvil/VerifyPolicy.cs' -- --maintainability --project-root '{project-root}' before review handoff, and again on the actual final candidate before the Final diff scope check passes and before step-05, Finalize Spec, done, sprint synchronization or Commit/publication. It scores all production and tool code, not only the diff, and excludes test projects (IsTestProject): .NET code metrics maintainability index (CA1505) at least 20 and cyclomatic complexity (CA1502) at most 25, and balanced coupling between production projects (docs/architecture/element-package-isolation.md §3). Balanced coupling is mandatory: it runs inside the same command, --coupling alone never replaces the gate, and a run whose output lacks the Coupling dependencies summary or either canary PASS line is Incomplete. Every listed type, member or coupling dependency, including pre-existing code outside the owned diff, is a confirmed high finding. Add it to the owned repair scope, return it to the implementation owner for a behaviour-preserving refactor in this slice, and independently re-review the fix. Never reject, defer, waive, suppress or exclude it, and never change a threshold, a rule, a declared project kind or a project's test marker. FAIL is Fail; a refused or missing run is Incomplete; both block completion.",
  "First-pass rules (21 November 2026 review; apply from the next slice that starts, under the AGENTS.md Stable rules): apply bmad-loop-protocol.md's Session environment check, Capability probe, Slice record, Handoff order and first-pass checks, Routing by what is wrong, Re-review scope and one-candidate-commit rules as on the Auto route. Pass each child the path of its card in {project-root}/_bmad/custom/role-cards.md with the launch.",
  "Load {project-root}/_bmad/custom/bmad-loop-protocol.md completely before entry; apply its preflight, isolation, repair and recovery rules and pass role-specific instructions to every child.",

  "Read {project-root}/_bmad/custom/bmad-loop-protocol.md before any routing, status write or dispatch. Apply its named replacements for entry/baseline, planning/repair, reviewer inputs, capacity and completion instead of the contrary native branches. Bind diff_file separately per role, with an informed header for authoritative auditors; resolve every child path before launch. These rules cover resumed/in-review/done and oneshot routes as well as first dispatch.",
  "Load {project-root}/_bmad/custom/project-engineering-contract.md and apply affected rule families at the native checkpoints below. Record applicability, source, planned or actual evidence and deferred gates in existing fields. The configured Element-Free Engine auditor also audits applicable project engineering rules; other lenses retain their purpose. Confirmed project-rule violations block approval; high severity applies only where owner policy requires it. Missing required-now evidence is Incomplete. Cover non-engine changes when a rule applies; no extra review loop or automatic runtime test round for documentation.",
  "Before proceeding, load the design guide and review policy from {project-root}/_bmad/custom/. Apply the planning gate before ready-for-dev, including inherited ready specs; apply the acceptance gate to delivered changes.",
]

implementation_handoff = '''
Follow {project-root}/_bmad/custom/bmad-loop-protocol.md before dispatch. On first implementation, launch a context-free subagent and record its ID in the native spec. On resume or repair, re-engage the recorded implementation owner with the current spec and findings; do not launch a fresh owner or reset baseline_revision. Apply the protocol's owner-unavailable handling if re-engagement fails. The implementation prompt is:

Read {project-root}/_bmad/custom/project-engineering-contract.md, {project-root}/_bmad/custom/element-free-engine-design.md and {project-root}/_bmad/custom/element-free-engine-review.md. Apply the phase-specific requirements to your assigned scope. Report violations or missing evidence in your required output format; the coordinator owns the blocking verdict.

Read the Implementation owner card in {project-root}/_bmad/custom/role-cards.md and follow it; it lists the recurring defects to avoid and the handoff order. Read {spec_file} fully and implement it. Load every file in its context frontmatter, resolving each path inside this checkout. Also read AGENTS.md and docs/testing-guidance.md; the owner's 28 October game-fidelity policy supersedes obsolete numerical acceptance in older specs. Resolve any conflict before implementation. Before handoff or the full round apply the protocol's Implementation handoff and verification ownership section: inspect the full owned diff early and record command executor, build/configuration, raw evidence and invalidating inputs in native fields. Before handoff run the protocol's Maintainability gate command and refactor every type, member or coupling dependency it lists, pre-existing ones included, until it passes. Do not suppress, exclude, reclassify or re-threshold anything. Report what changed, verification, the gate result and remaining risks.
'''

persistent_facts = [
  "file:{project-root}/_bmad/custom/bmad-loop-protocol.md",
  "file:{project-root}/_bmad/custom/project-engineering-contract.md",
  "file:{project-root}/_bmad/custom/element-free-engine-design.md",
  "file:{project-root}/_bmad/custom/element-free-engine-review.md",
  "file:{project-root}/_bmad/custom/role-cards.md",
  "Apply the design guide and review policy at the appropriate phase. Before delegation, resolve {project-root} to the current checkout and supply role-specific policy/input paths under bmad-loop-protocol.md; the coordinator and engineering auditor load all three guides. Record the policy verdict before readiness, acceptance or completion; blocking findings override default workflow shortcuts.",
  "Owner clarification, 29 October 2026: apply docs/testing-guidance.md#float-comparison-and-effort-rules. Use quantity-specific tolerances and generous game-time stall guards; no universal epsilon, fixed lesson ceiling or extra precision work without a concrete gameplay/interface defect. Reuse applicable passing evidence. A short rationale suffices; do not create a new precision audit.",
  "Owner policy, 28 October 2026: read AGENTS.md and docs/testing-guidance.md. Game outcomes, meaningful causal order and stability govern acceptance. Historical numerical traces, output hashes and unnecessarily tight scene tolerances are not requirements. Apply this policy to specifications, implementation handoffs and every review layer.",
]

[[workflow.review_layers]]
id = "blind-hunter"
name = "Blind Hunter"
instruction = '''
Launch a context-free subagent with this prompt:

Read only the Reviewer duties section of {project-root}/_bmad/custom/bmad-loop-protocol.md and applicable authoritative source sections supplied with this launch. Preserve your assigned lens and output contract. Your role-specific diff excludes generated narrative; do not seek claims or previous findings outside the inputs explicitly allowed by your lens. Report missing inputs and evidence limits. No quotas, mutants, deferred browser gates or unjustified precision requirements.

Read AGENTS.md and docs/testing-guidance.md. The owner's 28 October game-fidelity policy governs acceptance and overrides obsolete numerical goldens. Judge causal behaviour and stability; report unjustified precision as test design, not a solver defect.

Conduct a review of CONTENT.
Look for what's missing, not only what's wrong.
Report supported defects and unjustified test precision; there is no minimum finding count. Explain the gameplay or interface consequence.
Output a Markdown list of findings only — no severity, priority, or ranking.
If the content is empty, stop and say so.
If there are no supported findings, say so. Do not invent precision requirements or speculative work to fill a quota.

CONTENT: the unified diff at `{diff_file}`. Read that file — it is the content under review.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.
'''

