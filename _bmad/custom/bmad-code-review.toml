[[workflow.review_layers]]
id = "acceptance-auditor"
name = "Acceptance Auditor"
instruction = '''
Launch a subagent with this prompt:

Read {project-root}/_bmad/custom/project-engineering-contract.md, {project-root}/_bmad/custom/element-free-engine-design.md and {project-root}/_bmad/custom/element-free-engine-review.md. Apply the phase-specific requirements to your assigned scope. Report violations or missing evidence in your required output format; the coordinator owns the blocking verdict.

Read {project-root}/_bmad/custom/bmad-loop-protocol.md (Reviewer inputs and Reviewer duties). Your diff_file is the full owned candidate, with a header naming phase, candidate identity, native contract sections and verification receipts. Read those authoritative inputs; the native claims-only restriction does not apply to this informed audit. Missing required inputs or matching executed proof is Incomplete. Do not infer execution from test source. Planning requires planned evidence, not executed tests.

Read AGENTS.md and docs/testing-guidance.md. The owner's 28 October game-fidelity policy governs acceptance and overrides obsolete numerical goldens. Judge causal behaviour and stability; report unjustified precision as test design, not a solver defect.

You are an Acceptance Auditor. Review the provided diff against `{spec_file}` and any loaded context docs. Check for: violations of acceptance criteria, deviations from spec intent, missing implementation of specified behavior, contradictions between spec constraints and actual code. Output findings as a Markdown list. Each finding: one-line title, which AC/constraint it violates, and evidence from the diff.

Diff: the unified diff at `{diff_file}`. Read that file — it is the content under review.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.
'''
when = "Only when {review_mode} = \"full\"."

[[workflow.review_layers]]
id = "element-free-engine"
name = "Element-Free Engine Auditor"
instruction = '''
Launch a context-free subagent with this prompt:

Read {project-root}/_bmad/custom/project-engineering-contract.md, {project-root}/_bmad/custom/element-free-engine-design.md and {project-root}/_bmad/custom/element-free-engine-review.md. Apply the phase-specific requirements to your assigned scope. Report violations or missing evidence in your required output format; the coordinator owns the blocking verdict.

Read {project-root}/_bmad/custom/bmad-loop-protocol.md (Reviewer inputs and Reviewer duties). Your diff_file is the full owned candidate, with a header naming phase, candidate identity, native contract sections and verification receipts. Read those authoritative inputs; the native claims-only restriction does not apply to this informed audit. Missing required inputs or matching executed proof is Incomplete. Do not infer execution from test source. Planning requires planned evidence, not executed tests.

Audit the unified diff at {diff_file} and the affected declaration-to-execution path against the design guide. Trace concrete alternate declarations, explicit references, ownership and varied-declaration tests. Use the review policy's finding format; state inspected scope and evidence limits if clean. Do not invoke skills, spawn agents, edit files, run mutants or require deferred browser qualification.
'''
