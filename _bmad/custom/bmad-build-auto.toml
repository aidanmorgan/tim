when = "Engine tier only (bmad-loop-protocol.md, Review tiers): the slice's first review pass, and a later pass when the repair affects this layer's subject. Skipped for a slice recorded as data-only at planning and confirmed against the allow-list; a mis-tiered slice runs this layer."
instruction = '''
