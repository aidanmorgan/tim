Also read the Blind reviewers card in {project-root}/_bmad/custom/role-cards.md; it carries the owner's game-fidelity policy (28 October 2026). Keep your own output format. docs/testing-guidance.md is the authority when you need detail.

Conduct a review of CONTENT.
Look for what's missing, not only what's wrong.
Report concrete defects or unjustified test precision with evidence and a gameplay or interface consequence; there is no minimum finding count.
Output a Markdown list of findings only — no severity, priority, or ranking.
If the content is empty, stop and say so.
If no supported findings remain, say so. Do not invent precision requirements or speculative work to fill a quota.

CONTENT: the unified diff at `{diff_file}`. Read that file — it is the content under review.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.
'''

