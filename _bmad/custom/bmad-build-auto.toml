# Project overrides. Requirements: element-free-engine-design.md; verdicts: element-free-engine-review.md.
# Keep policy text in those guides; prompts below load them explicitly for context-free agents.
[workflow]
activation_steps_append = [
  "Step-04 post-review: after every confirmed finding is fixed and affected independent re-review is complete, run bmad-loop-protocol.md's Final diff scope check and required simplification analysis on the full owned candidate before Finalize, done, sprint synchronization or Commit/publication. Record Final diff scope in Review Triage Log/Auto Run Result; Fail or Incomplete blocks completion. This sequential check is not an additional review layer.",
  '''
Apply the engine gate within this Auto iteration, not as a separate review workflow:
1. Step-01 routing: before any ready/in-progress resume jumps to implementation, verify the selected spec has the eight affected-design answers and a current planning verdict. Reopen a conflicting spec through the native blocked/bad_spec route; a stored ready status is not evidence.
2. Step-02 Plan: put those answers in the existing Code Map/plan/verification sections, include both guides in context, and record the planning verdict before ready-for-dev. Planned tests suffice here.
3. Step-03: dispatch the customized implementation_handoff; return conflicts to planning.
4. Step-04: run the configured Element-Free Engine Auditor in the same review loop. In Classify, a confirmed in-scope engine violation is high; bad_spec applies when the design is wrong. Do not carry a historical verdict that conflicts with current policy, reject a finding merely because its fix edits a spec, or defer it merely because it concerns agent-context files.
5. Before Finalize sets done or Commit runs, put the acceptance verdict, scope and proof references in Review Triage Log/Auto Run Result. Fail or Incomplete blocks that transition. After any relevant fix, obtain independent re-review of that fix before approval. Publication follows existing owner rules; on_complete is not the approval gate.
''',
]

activation_steps_prepend = [
  "Before dispatch run dotnet run --file '{project-root}/tools/anvil/VerifyPolicy.cs' -- --bmad-check --project-root '{project-root}' --route Auto. Apply Effective configuration preflight after structural checks; condition meaning and route behavior require semantic inspection.",
  "Maintainability gate (owner, 5 November 2026; project-engineering-contract.md E9 and bmad-loop-protocol.md Maintainability gate). This is a hard gate for every slice that starts after adoption (9A.46e, in progress at adoption, finishes under its starting rules; coupling findings do not block 9A.46g, in progress when coupling was added on 6 November 2026): no route, resume, size or shortcut skips it. Run dotnet run --file '{project-root}/tools/anvil/VerifyPolicy.cs' -- --maintainability --project-root '{project-root}' before review handoff, and again on the actual final candidate before the Final diff scope check passes and before Finalize, done, sprint synchronization or Commit/publication. It scores all production and tool code, not only the diff, and excludes test projects (IsTestProject): .NET code metrics maintainability index (CA1505) at least 20 and cyclomatic complexity (CA1502) at most 25, and balanced coupling between production projects (docs/architecture/element-package-isolation.md §3). Balanced coupling is mandatory: it runs inside the same command, --coupling alone never replaces the gate, and a run whose output lacks the Coupling dependencies summary or either canary PASS line is Incomplete. Every listed type, member or coupling dependency, including pre-existing code outside the owned diff, is a confirmed high finding. Add it to the owned repair scope, return it to the implementation owner for a behaviour-preserving refactor in this slice, and independently re-review the fix. Never reject, defer, waive, suppress or exclude it, and never change a threshold, a rule, a declared project kind or a project's test marker. FAIL is Fail; a refused or missing run is Incomplete; both block completion.",
  "Before step-01 folder-plus-story first/draft routing, apply Bounded story entry in the loop protocol instead of native all-sibling accumulation.",
  "First-pass rules (21 November 2026 review; apply from the next slice that starts, under the AGENTS.md Stable rules). At session start or resume run the protocol's Session environment check. In step-02, before the planning verdict, apply the protocol's Capability probe: dispatch the read-only planning scout with its card from {project-root}/_bmad/custom/role-cards.md, record cited capabilities, direct consumers and open decisions in the Code Map, split a missing solver, ABI, wire or shared-presentation capability into its own engine slice published first, decide defaultable owner decisions and record them, raise every remaining one together in a single native blocked HALT with recommended defaults, and read the touched deferred-work entries and the previous slice's close note. Keep every native spec section in the spec as the contract, one line per log row, with bulk evidence in the append-only run log (protocol: Slice record); children read the contract fully and the run log only by cited entry. In step-04 Classify, route each confirmed finding by what is wrong (protocol: Routing by what is wrong): a missing, weak or over-precise test or a stale document is patch, and bad_spec is only for wrong or missing specified behaviour, design answer or prerequisite. Apply the protocol's Re-review scope: from the third review pass, only a new finding outside the repair diff and what it directly affects, breaking no hard rule, required-now criterion or gameplay behaviour, is deferred instead of blocking. The handoff full round satisfies step-03 Verify; a second runs only if the candidate changed. Write the run-log close note and deferred-work additions before the candidate commit; completion is one candidate commit and one SnapshotApproval. The coordinator waits with a blocking tool call in the same turn, not a timed poll.",
  "Loop economy rules (owner-approved, 21 November 2026; apply from the next slice that starts under the AGENTS.md Stable rules, so Bellows 12.4 and registration-derivation finish under their starting rules). In step-02 record in the Code Map whether the slice is a single element, a Family slice or a closure review of delivered duplicates, any duplicate of this part that it closes, and its review tier with the probe's location (protocol: Slice shapes, Review tiers; the protocol's allow-list is the only definition of data-only). Keep the contract inside the protocol's Contract budget: design answers of at most three lines, bulk in the run log. In step-03 Verify and in step-04 do not read the staged diff into your own context: read git diff --stat against the owned scope list, the handoff report with its command results, and only the hunks a finding cites (protocol: Coordinator reading and the review step, which also lists step-04 in order). Stage the blind layers' diff without the generated and asset pathspecs named in the protocol's Reviewer inputs. Before each launch compare the changed paths with that allow-list, open the hunks of any path accepted as a list line, and name the tier and probe location in the informed header. Launch only the tier's layers, with both auditors and Verification Gap on every pass; a mis-tiered slice reruns all six as a first pass. Have an informed existing reviewer perform the Final diff scope check from the full owned diff. The planning scout, check runners and status reconciliation may run on a smaller model; implementers, reviewers and auditors keep the inherited one. Validate writes in batches: the validation calls in one response, the allowed writes in the next.",
  "Read the test-authoring rules in the Implementation owner card of role-cards.md into planning: every matrix and acceptance row gets a named discriminating test with its control and boundary case in the contract's acceptance-to-test table before ready-for-dev.",
  "Load {project-root}/_bmad/custom/bmad-loop-protocol.md completely before entry; apply its preflight, isolation, repair and recovery rules and pass role-specific instructions to every child.",

  "Read {project-root}/_bmad/custom/bmad-loop-protocol.md before any routing, status write or dispatch. Apply its named replacements for entry/baseline, planning/repair, reviewer inputs, capacity and completion instead of the contrary native branches. Bind diff_file separately per role, with an informed header for authoritative auditors; resolve every child path before launch. These rules cover resumed/in-review/done and oneshot routes as well as first dispatch.",
  "Load {project-root}/_bmad/custom/project-engineering-contract.md and apply affected rule families at the native checkpoints below. Record applicability, source, planned or actual evidence and deferred gates in existing fields. The configured Element-Free Engine auditor also audits applicable project engineering rules; other lenses retain their purpose. Confirmed project-rule violations block approval; high severity applies only where owner policy requires it. Missing required-now evidence is Incomplete. Cover non-engine changes when a rule applies; no extra review loop or automatic runtime test round for documentation.",
  "Before proceeding, load the design guide and review policy from {project-root}/_bmad/custom/. Apply the planning gate before ready-for-dev, including inherited ready specs; apply the acceptance gate to delivered changes.",
]

implementation_handoff = '''
Follow {project-root}/_bmad/custom/bmad-loop-protocol.md before dispatch. On first implementation, launch a context-free subagent and record its ID in the native spec. On resume or repair, re-engage the recorded implementation owner with the current spec and findings; do not launch a fresh owner or reset baseline_revision. Apply the protocol's owner-unavailable handling if re-engagement fails. The implementation prompt is:

Read {project-root}/_bmad/custom/project-engineering-contract.md, {project-root}/_bmad/custom/element-free-engine-design.md and {project-root}/_bmad/custom/element-free-engine-review.md. Apply the phase-specific requirements to your assigned scope. Report violations or missing evidence in your required output format; the coordinator owns the blocking verdict.

Read the Implementation owner card in {project-root}/_bmad/custom/role-cards.md first and follow it; it lists the recurring defects to avoid and the handoff order. Read {spec_file} (the contract) fully and implement it; read its run log only for an entry the contract cites. Load every file in its context frontmatter, resolving each path inside this checkout. Also read AGENTS.md and docs/testing-guidance.md; the owner's 28 October game-fidelity policy supersedes obsolete numerical acceptance in older specs. Resolve any conflict before implementation. Before the first edit, check the contract's Capability probe (in its Code Map) against the code and return a missing capability to planning. Follow the protocol's Handoff order and first-pass checks: the matching compiler-log builds once per changed candidate, the maintainability gate (it builds in its own folder, so nothing is rebuilt after it), new-package registration check, the filled acceptance-to-test table in Verification, a clean git diff --check and the full local round, in that order. Before handoff or the full round apply the protocol's Implementation handoff and verification ownership section: inspect the full owned diff early and record command executor, build/configuration, raw evidence and invalidating inputs in native fields. Before handoff run the protocol's Maintainability gate command and refactor every type, member or coupling dependency it lists, pre-existing ones included, until it passes. Do not suppress, exclude, reclassify or re-threshold anything. Report what changed, verification, the gate result and remaining risks.
'''

