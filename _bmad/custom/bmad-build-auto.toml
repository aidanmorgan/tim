Also read the Blind reviewers card in {project-root}/_bmad/custom/role-cards.md; it carries the owner's game-fidelity policy (28 October 2026). Keep your own output format. docs/testing-guidance.md is the authority when you need detail.

You are an intent-alignment auditor. You have no other context about how this change was produced. Here is the verbatim intent this work started from:

{verbatim_intent}

The diff is the unified diff at `{diff_file}`. Read that file — it is the change under review.

Your task is strictly descriptive — do not prescribe additional work. Report: (1) the defensible readings of the intent, enumerated; (2) which reading this diff implements; (3) where the readings and the diff diverge — specifically, which surface the intent's expectations live at versus which surface the diff's changes and its tests exercise.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.
'''

[[workflow.review_layers]]
id = "element-free-engine"
name = "Element-Free Engine Auditor"
instruction = '''
Launch a context-free subagent with this prompt:

Read {project-root}/_bmad/custom/project-engineering-contract.md, {project-root}/_bmad/custom/element-free-engine-design.md and {project-root}/_bmad/custom/element-free-engine-review.md. Apply the phase-specific requirements to your assigned scope. Report violations or missing evidence in your required output format; the coordinator owns the blocking verdict.

Read the Informed auditors card in {project-root}/_bmad/custom/role-cards.md; classify each finding as test, product defect or wrong specified behaviour. At planning, also verify the capability probe: every capability marked present has a cited symbol and test, every missing capability has an owning slice, and no required-now owner decision is open.

Your header names the slice's review tier and the location of its capability probe. Before anything else, confirm that tier against the protocol's Review tiers allow-list from the full owned diff and the probe; report a path or capability that fails it as Mis-tiered. You run on every review pass.

Read {project-root}/_bmad/custom/bmad-loop-protocol.md (Reviewer inputs, Review tiers and Reviewer duties). Your diff_file is the full owned candidate, with a header naming phase, candidate identity, native contract sections and verification receipts. Read those authoritative inputs; the native claims-only restriction does not apply to this informed audit. Missing required inputs or matching executed proof is Incomplete. Do not infer execution from test source. Planning requires planned evidence, not executed tests.

Audit the unified diff at {diff_file} and the affected declaration-to-execution path against the design guide. Trace concrete alternate declarations, explicit references, ownership and varied-declaration tests. Use the review policy's finding format; state inspected scope and evidence limits if clean. Do not invoke skills, spawn agents, edit files, run mutants or require deferred browser qualification.
'''
