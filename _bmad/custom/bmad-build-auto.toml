# Curious Contraptions overrides for bmad-build-auto.
# Merge rules (see .claude/skills/bmad-build-auto/customize.toml): lists append,
# arrays of tables merge by `id` (a new id appends a layer).

[workflow]

implementation_handoff = """
Launch a context-free subagent with this prompt:

Read {spec_file} fully and implement it. Load every file in its context frontmatter. Also read AGENTS.md and docs/testing-guidance.md; the owner's 28 October game-fidelity policy supersedes obsolete numerical acceptance in older specs. Resolve any conflict before implementation. Report what changed, verification and remaining risks.
"""

persistent_facts = [
  "Owner policy (28 October 2026): this is a physics puzzle game, not a precision simulation benchmark. Read docs/testing-guidance.md and follow its game-fidelity policy. Test meaningful outcomes, causal interactions, stability and lifecycle. Historical tick proximity, incidental contact ordering, archived trajectories and simulation-output hashes/byte identity are not acceptance. Every strict physical assertion needs a gameplay or defined-interface reason; ULPs/slop fractions alone do not justify scene-level precision. Before a second numerical repair attempt, distinguish a gameplay defect from an over-specified test. Reviewers report unjustified precision as a test-design finding, not a solver defect. Exact typed identities, authored-state restoration, deliberate timing features and justified local mathematical contracts remain protected.",
  "Owner review gate (AGENTS.md, Refactor forward, 25 Oct 2026). A confirmed Forward-Only Auditor finding is triaged `high`. It is never `low`, never rejected as out of scope, and never deferred. It routes to patch, or to bad_spec when the spec asked for the fallback or compatibility. A slice cannot reach `done` while one is unresolved.",
  "No mutation testing until the post-catalogue E2E phase (owner, 25 Oct 2026). Neither the implementer nor any review layer creates, builds or runs mutants or mutated copies of the tree. Verification judges by reading the tests' assertions.",
]

[[workflow.review_layers]]
id = "verification-gap"
name = "Verification Gap Reviewer"
instruction = """
Launch a context-free subagent with this prompt:

Read `{skill-root}/review-prompts/verification-gap.md` completely and follow it as your review instructions.

Game-fidelity rule: Owner policy (28 October 2026): this is a physics puzzle game, not a precision simulation benchmark. Read docs/testing-guidance.md and follow its game-fidelity policy. Test meaningful outcomes, causal interactions, stability and lifecycle. Historical tick proximity, incidental contact ordering, archived trajectories and simulation-output hashes/byte identity are not acceptance. Every strict physical assertion needs a gameplay or defined-interface reason; ULPs/slop fractions alone do not justify scene-level precision. Before a second numerical repair attempt, distinguish a gameplay defect from an over-specified test. Reviewers report unjustified precision as a test-design finding, not a solver defect. Exact typed identities, authored-state restoration, deliberate timing features and justified local mathematical contracts remain protected.

Owner rule (25 Oct 2026): mutation testing is deferred until the post-catalogue E2E phase. Do NOT create, copy, build or run mutants, mutated trees or probe tests, and do not run the test suite. Judge each Demonstration by reading the relevant tests' assertions and the code they exercise.

Review content: the unified diff at `{diff_file}`. Read that file — it is the content under review.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.

"""

[[workflow.review_layers]]
id = "forward-only"
name = "Forward-Only Auditor"
instruction = """
Launch a context-free subagent with this prompt:

You audit a change for one rule only, the project's owner rule "Refactor forward": exactly one current path. That means no fallback, compatibility shim, legacy mode, old-name alias or automatic migration, and no backwards-compatibility shims, helpers or bridges.

Content under review: the unified diff at `{diff_file}`. Read that file. For each added or kept item, read the surrounding code it touches so you can judge it.

Report every place where the change adds or keeps any of these:
- a fallback path;
- backwards compatibility: a shim, helper, bridge or adapter for an old format or old caller, a legacy mode, an old-name alias or re-export, a migration or upgrade path, or a version branch;
- a deprecated field, member, file or schema slot kept so old inputs keep working;
- code that reads old-format content;
- a second rule or code path for the same behaviour, chosen by a condition, flag, mode, environment variable or toggle. This includes a "fallback" branch that applies a different rule from the main path.

Two things are not violations:
- Refusing unsupported input with a typed, visible reason, where detection only names the refusal and never reads or uses the old content.
- A numerical recovery inside one algorithm, such as a singular-matrix per-row solve, that applies the same rule as the main path.

When an item is borderline, report it and state which side of the rule it falls on, and why.

Output a Markdown list. For each finding give: the file and line, what was added or kept, which clause of the rule it breaks, and the smallest forward-only fix (usually deletion, or refusal with a typed reason). If you find nothing, say so and list what you checked.

Do not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.
"""

[[workflow.review_layers]]
id = "blind-hunter"
name = "Blind Hunter"
instruction = "Launch a context-free subagent with this prompt:\n\nProject owner policy (28 October 2026): read AGENTS.md and docs/testing-guidance.md. Evaluate game-relevant behaviour, not historical numerical identity. Unjustified precision in tests is a finding. Do not demand exact arrival ticks or incidental contact sequences absent a feature contract.\n\nConduct a review of CONTENT.\nLook for what's missing, not only what's wrong.\nReport concrete defects or unjustified test precision with evidence and a gameplay or interface consequence; there is no minimum finding count.\nOutput a Markdown list of findings only — no severity, priority, or ranking.\nIf the content is empty, stop and say so.\nIf no supported findings remain, say so. Do not invent precision requirements or speculative work to fill a quota.\n\nCONTENT: the unified diff at `{diff_file}`. Read that file — it is the content under review.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\n"

[[workflow.review_layers]]
id = "edge-case-hunter"
name = "Edge Case Hunter"
instruction = "Launch a context-free subagent with this prompt:\n\nProject owner policy (28 October 2026): read AGENTS.md and docs/testing-guidance.md. Evaluate game-relevant behaviour, not historical numerical identity. Unjustified precision in tests is a finding. Do not demand exact arrival ticks or incidental contact sequences absent a feature contract.\n\nRead `{skill-root}/review-prompts/edge-case-hunter.md` completely and follow it as your review instructions.\n\nclaims_file (leave unread until your instructions call for it): {claims_file}\n\nReview content: the unified diff at `{diff_file}`. Read that file — it is the content under review.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. If the instruction file is unreadable, report that exact failure and stop. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\n"

[[workflow.review_layers]]
id = "intent-alignment"
name = "Intent Alignment Auditor"
instruction = "Launch a subagent with this prompt:\n\nProject owner policy (28 October 2026): read AGENTS.md and docs/testing-guidance.md. Evaluate game-relevant behaviour, not historical numerical identity. Unjustified precision in tests is a finding. Do not demand exact arrival ticks or incidental contact sequences absent a feature contract.\n\nYou are an intent-alignment auditor. You have no other context about how this change was produced. Here is the verbatim intent this work started from:\n\n{verbatim_intent}\n\nThe diff is the unified diff at `{diff_file}`. Read that file — it is the change under review.\n\nYour task is strictly descriptive — do not prescribe additional work. Report: (1) the defensible readings of the intent, enumerated; (2) which reading this diff implements; (3) where the readings and the diff diverge — specifically, which surface the intent's expectations live at versus which surface the diff's changes and its tests exercise.\n\nDo not invoke any skill, and do not spawn subagents of your own — you are the reviewer. Return your findings as text in your final message; do not route them through any findings-reporting tool the host may offer.\n\n"
