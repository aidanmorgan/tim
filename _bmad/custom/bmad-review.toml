# Project overrides. Requirements: element-free-engine-design.md; verdicts: element-free-engine-review.md.
# Keep policy text in those guides; prompts below load them explicitly for context-free agents.
[workflow]
activation_steps_prepend = [
  "Before dispatch run dotnet run --file '{project-root}/tools/anvil/VerifyPolicy.cs' -- --bmad-check --project-root '{project-root}' --route <selected-route>; first substitute the selected native route: ReviewEngineering for engineering approval, or ReviewPartial with --lenses naming the exact requested lenses. Apply Effective configuration preflight after structural checks; condition meaning and route behavior require semantic inspection.",
  "Maintainability gate (owner, 5 November 2026; project-engineering-contract.md E9 and bmad-loop-protocol.md Maintainability gate). This is a hard gate for every slice that starts after adoption (9A.46e, in progress at adoption, finishes under its starting rules; coupling findings do not block 9A.46g, in progress when coupling was added on 6 November 2026). Before this review is used as engineering or implementation approval (ReviewEngineering), run dotnet run --file '{project-root}/tools/anvil/VerifyPolicy.cs' -- --maintainability --project-root '{project-root}' on the reviewed candidate, or verify a matching recorded run for the same candidate identity. It scores all production and tool code and excludes test projects (IsTestProject): .NET code metrics maintainability index (CA1505) at least 20 and cyclomatic complexity (CA1502) at most 25, and balanced coupling between production projects (docs/architecture/element-package-isolation.md §3). Balanced coupling is mandatory: it runs inside the same command, --coupling alone never replaces the gate, and a run whose output lacks the Coupling dependencies summary or either canary PASS line is Incomplete. Report every listed type, member or coupling dependency as a confirmed high blocking finding, including pre-existing code. Never reject it as pre-existing or out of scope, defer, waive, suppress or exclude it, and never change a threshold, a rule, a declared project kind or a project's test marker. FAIL is Fail; a refused or missing run is Incomplete. An exact partial lens request (ReviewPartial) finishes as requested and cannot grant approval without this gate.",
  "Load {project-root}/_bmad/custom/bmad-loop-protocol.md completely before entry; apply its preflight, isolation, repair and recovery rules and pass role-specific instructions to every child.",

  "Read {project-root}/_bmad/custom/bmad-loop-protocol.md before any routing, status write or dispatch. Apply its named replacements for entry/baseline, planning/repair, reviewer inputs, capacity and completion instead of the contrary native branches. Pass each role-specific staged file through this skill's native content path, with informed contract/evidence context for the engineering lens; resolve every child path before launch. Direct document review keeps the supplied artifact as content and does not require a VCS diff or implementation spec.","Load {project-root}/_bmad/custom/project-engineering-contract.md and apply affected E1\u2013E8 rules at native planning/triage checkpoints. The dedicated Element-Free Engine auditor also audits all applicable project engineering rules, including non-engine changes. Preserve other lenses and exact partial-review requests. Record applicability, evidence and deferred gates in existing fields; confirmed violations block approval with source-policy severity, missing required-now evidence is Incomplete."]
activation_steps_append = [
  "Before a caller uses the completed review for implementation acceptance, after confirmed repairs and affected independent re-review, require bmad-loop-protocol.md's Final diff scope check and required simplification analysis and its native Final diff scope record. This caller completion check is not another lens: preserve exact partial lens sets and raw output contracts. Direct artifact review retains supplied content and available revision without forcing a Git baseline; findings-only completion cannot claim implementation approval.",
  '''
At lens selection, include the configured element-free-engine lens when automatic selection covers any applicable project engineering rule. An explicitly requested lens set must remain exact: editorial-only or other partial review is not project engineering approval. Do not add unauthorized findings to an exact JSON/output contract.
Before a caller uses this review as planning or implementation approval, require the configured auditor to cover the applicable project engineering and engine-design rules for the affected scope (reuse current applicable independent evidence when available). The caller records the phase verdict separately if the raw lens format cannot carry it. The dedicated lens checks design requirements; all lenses retain their assigned purpose. A partial review may finish as requested but cannot waive the missing approval evidence.
''',
]

review_guidance = [
  "Apply bmad-loop-protocol.md Reviewer duties and role-scoped source inputs supplied by the coordinator. The informed engineering lens receives full contract/evidence; blind lenses receive product content without generated claims. Preserve exact requested lens sets; partial review does not grant acceptance.",
  "Read AGENTS.md and docs/testing-guidance.md. The owner 28 October game-fidelity policy governs every lens: require gameplay or interface consequences, not archived ticks, trajectory identity or unnecessarily tight physical assertions. Flag over-specified tests; do not invent findings to fill quotas.",
]

persistent_facts = [
  "file:{project-root}/_bmad/custom/bmad-loop-protocol.md",
  "file:{project-root}/_bmad/custom/project-engineering-contract.md",
  "file:{project-root}/_bmad/custom/element-free-engine-design.md",
  "file:{project-root}/_bmad/custom/element-free-engine-review.md",
  "Apply the design guide and review policy at the appropriate phase. Before delegation, resolve {project-root} to the current checkout and supply role-specific policy/input paths under bmad-loop-protocol.md; the coordinator and engineering auditor load all three guides. Record the policy verdict before readiness, acceptance or completion; blocking findings override default workflow shortcuts.",
  "Owner clarification, 29 October 2026: apply docs/testing-guidance.md#float-comparison-and-effort-rules. Use quantity-specific tolerances and generous game-time stall guards; no universal epsilon, fixed lesson ceiling or extra precision work without a concrete gameplay/interface defect. Reuse applicable passing evidence. A short rationale suffices; do not create a new precision audit.",
  "Owner policy, 28 October 2026: read AGENTS.md and docs/testing-guidance.md. Game outcomes, meaningful causal order and stability govern acceptance. Historical numerical traces, output hashes and unnecessarily tight scene tolerances are not requirements. Apply this policy to specifications, implementation handoffs and every review layer.",
]

[[workflow.lenses]]
code = "element-free-engine"
name = "Element-Free Engine"
applies_to = "any"
when = "Any artifact or code affected by project engineering rules E1–E9, including engine design, visual/lifecycle contracts, verification and delivery planning."
instruction = "Read {project-root}/_bmad/custom/project-engineering-contract.md, {project-root}/_bmad/custom/element-free-engine-design.md and {project-root}/_bmad/custom/element-free-engine-review.md. Apply the phase-specific requirements to your assigned scope. Report violations or missing evidence in your required output format; the coordinator owns the blocking verdict.  Read {project-root}/_bmad/custom/bmad-loop-protocol.md (Reviewer inputs and Reviewer duties). Your supplied native content path contains the full reviewed artifact or owned candidate, with informed context naming phase, artifact/candidate identity, authoritative sections and required evidence references. For direct document review, inspect the artifact itself rather than manufacturing an implementation diff. Read those authoritative inputs; the native claims-only restriction does not apply to this informed audit. Missing required inputs or matching executed proof is Incomplete. Do not infer execution from test source. Planning requires planned evidence, not executed tests. Audit the supplied content and its affected dependency behavior. Use the standard lens/location/trigger_condition/guard_snippet/potential_consequence fields; omit severity from raw findings. No quotas."
