<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Canonical GPU body — development fixture</title>
<style>body{background:#eee5d7;color:#343a3c;font:18px system-ui;max-width:960px;margin:2rem auto}input,button{font:inherit;margin:.4rem;padding:.4rem}canvas{background:#d7dfdc;width:100%;height:260px}pre{white-space:pre-wrap;font-size:14px}</style>
<h1>One canonical GPU body</h1>
<p>Development fixture. The unported game is not GPU-qualified.</p>
<label>Origin (metres)<input id="origin" type="number" value="0" step="0.01"></label>
<label>Velocity (metres/second)<input id="speed" type="number" value="1" step="0.01"></label>
<label>Duration (seconds)<input id="duration" type="number" value="30" min="1" max="60"></label>
<p><button id="construct">Construct body</button><button id="run">Run</button><button id="reset">Reset</button></p>
<canvas id="view" width="960" height="260"></canvas><pre id="status">Starting C# simulation worker…</pre>
<script type="module" src="./main.js"></script></html>
